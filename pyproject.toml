[project]
name = "pirateface"
version = "0.1.1"
description = "Download Hugging Face models over BitTorrent from Pirate Face seeders. No code changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
keywords = ["huggingface", "bittorrent", "libtorrent", "models", "download"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=2.0",
    "libtorrent>=2.0",
    "tqdm>=4.42",
]

[project.urls]
Homepage = "https://pirateface.co"
Source = "https://github.com/pirateface/pirateface_hub"
Issues = "https://github.com/pirateface/pirateface_hub/issues"

[project.scripts]
pf = "pirateface.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pirateface"]

[tool.hatch.build.targets.wheel.force-include]
"src/pirateface.pth" = "pirateface.pth"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "SIM", "PTH", "RUF"]
# Broad excepts are deliberate: any failure falls back to Hugging Face.
ignore = ["BLE001"]
